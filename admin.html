<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>VibraTickets | Panel Administrador</title>

    <link rel="stylesheet" href="css/styles.css">

    <link rel="stylesheet" href="css/responsive.css">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!--================ HEADER ================-->

    <header class="header">

        <div class="logo">

            <img src="assets/logo.png" alt="Logo">

            <h2>VibraTickets</h2>

        </div>

        <div class="acciones">

            <button class="btn-icono">

                <i class="fa-solid fa-bell"></i>

            </button>

            <img
                src="assets/icono.png"
                class="avatar"
                alt="Administrador">

            <span class="nombreUsuario">

                Administrador

            </span>

            <button
                class="btnSalir"
                id="cerrarSesion">

                <i class="fa-solid fa-right-from-bracket"></i>

            </button>

        </div>

    </header>

    <!--================ CONTENIDO ================-->

    <main class="admin">

        <section class="encabezadoAdmin">

            <div>

                <h1>Dashboard</h1>

                <p>

                    Bienvenido nuevamente 👋

                </p>

            </div>

            <button
                class="btnPrincipal"
                id="nuevoEvento">

                <i class="fa-solid fa-plus"></i>

                Nuevo Evento

            </button>

        </section>

        <!--================ ESTADÍSTICAS ================-->

        <section class="cardsDashboard">

            <article class="card">

                <i class="fa-solid fa-calendar-days"></i>

                <h2 id="totalEventos">0</h2>

                <p>Total Eventos</p>

            </article>

            <article class="card">

                <i class="fa-solid fa-layer-group"></i>

                <h2 id="totalCategorias">0</h2>

                <p>Categorías</p>

            </article>

            <article class="card">

                <i class="fa-solid fa-ticket"></i>

                <h2 id="totalEntradas">0</h2>

                <p>Entradas Vendidas</p>

            </article>

            <article class="card">

                <i class="fa-solid fa-dollar-sign"></i>

                <h2 id="ingresos">$0</h2>

                <p>Ingresos</p>

            </article>

        </section>

        <!--================ TABLA ================-->

        <section class="panelTabla">

            <div class="tituloTabla">

                <h2>

                    Gestión de Eventos

                </h2>

                <input
                    type="text"
                    id="buscarAdmin"
                    placeholder="Buscar evento...">

            </div>

            <table>

                <thead>

                    <tr>

                        <th>Código</th>

                        <th>Evento</th>

                        <th>Categoría</th>

                        <th>Ciudad</th>

                        <th>Fecha</th>

                        <th>Precio</th>

                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody id="listaEventos">

                </tbody>

            </table>

        </section>

    </main>

    <!--================ MODAL ================-->

    <div
        class="modal oculto"
        id="modalEvento">

        <div class="modalContenido">

            <div class="modalHeader">

                <h2>

                    Nuevo Evento

                </h2>

                <button id="cerrarModal">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

            <form id="formEvento">

                <input
                    type="text"
                    id="codigo"
                    placeholder="Código">

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre del evento">

                <select id="categoria">

                    <option value="">

                        Seleccione una categoría

                    </option>

                    <option>Conciertos</option>

                    <option>Festivales</option>

                    <option>Teatro</option>

                    <option>Deportes</option>

                </select>

                <select id="ciudad">

                    <option>Bogotá</option>

                    <option>Medellín</option>

                    <option>Cali</option>

                    <option>Barranquilla</option>

                    <option>Bucaramanga</option>

                </select>

                <input
                    type="date"
                    id="fecha">

                <input
                    type="time"
                    id="hora">

                <input
                    type="number"
                    id="precio"
                    placeholder="Precio">

                <input
                    type="text"
                    id="imagen"
                    placeholder="Imagen del evento">

                <textarea
                    id="descripcion"
                    placeholder="Descripción del evento"></textarea>

                <button
                    type="submit"
                    class="btnPrincipal">

                    Guardar Evento

                </button>

            </form>

        </div>

    </div>

    <!--================ FOOTER ================-->

    <footer class="footer">

        <p>

            © 2026 VibraTickets | Panel Administrativo

        </p>

    </footer>

    <script src="js/data-seed.js"></script>

    <script src="js/storage.js"></script>

    <script src="js/components.js"></script>

    <script src="js/admin.js"></script>

</body>

</html>
